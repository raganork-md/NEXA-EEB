<!DOCTYPE html>
<html>
<head>
  <title>NEXA Pairing</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: sans-serif;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    .box {
      font-size: 25px;
      letter-spacing: 5px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>NEXA Pairing</h1>

<input id="phone" placeholder="Enter number"/>
<br>
<button onclick="start()">Get Code</button>

<div class="box" id="code"></div>
<div id="msg"></div>
<div class="box" id="session"></div>

<script>
const socket = io();

function start() {
  const phone = document.getElementById("phone").value;
  socket.emit("pair", phone);
}

socket.on("pair", (code) => {
  document.getElementById("code").innerText = code;
});

socket.on("msg", (msg) => {
  document.getElementById("msg").innerText = msg;
});

socket.on("session", (session) => {
  document.getElementById("session").innerText = session;
});
</script>

</body>
</html>
